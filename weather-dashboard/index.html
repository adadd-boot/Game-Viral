<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⛅ Weather Dashboard</h1>
            <p class="subtitle">Get real-time weather updates</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter city name..." 
                class="search-input"
            >
            <button id="searchBtn" class="search-btn">Search</button>
            <button id="geoBtn" class="geo-btn">📍 Use My Location</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="loadingSpinner" class="loading-spinner"></div>

        <!-- Current Weather -->
        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-header">
                <div>
                    <h2 id="cityName" class="city-name"></h2>
                    <p id="dateTime" class="date-time"></p>
                </div>
                <div class="weather-icon-large">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
            </div>

            <div class="weather-main">
                <div class="temperature">
                    <span id="temp" class="temp-value"></span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="weather-description">
                    <p id="description" class="description"></p>
                    <p id="feelsLike" class="feels-like"></p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-card">
                    <span class="detail-icon">💧</span>
                    <div class="detail-info">
                        <p class="detail-label">Humidity</p>
                        <p id="humidity" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">💨</span>
                    <div class="detail-info">
                        <p class="detail-label">Wind Speed</p>
                        <p id="windSpeed" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">🌡️</span>
                    <div class="detail-info">
                        <p class="detail-label">Pressure</p>
                        <p id="pressure" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">👁️</span>
                    <div class="detail-info">
                        <p class="detail-label">Visibility</p>
                        <p id="visibility" class="detail-value"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastSection" class="forecast-section hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-container"></div>
        </div>

        <!-- Recent Searches -->
        <div id="recentSearches" class="recent-searches">
            <h3>Recent Searches</h3>
            <div id="recentList" class="recent-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
